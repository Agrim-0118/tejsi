<main class="container page"><h1>Contact</h1><p class="intro">Want to contribute or ask questions? Fill the form.</p>
<div class="contact-grid"><form class="card contact-form">
<label>Name<input type="text" id="name"></label>
<label>Email<input type="email" id="email"></label>
<label>Org<input type="text" id="org"></label>
<label>Message<textarea id="message"></textarea></label>
<button type="button" id="sendBtn" class="btn">Save</button></form>
<div class="card contact-space"><h3>Your info</h3><div id="savedInfo">No data yet</div></div></div></main>
<footer class="site-footer">© 2025 EcoGuardians</footer><script src="js/main.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js')
    .then(()=> console.log('Service Worker Registered'))
    .catch(e=> console.log('SW register failed', e));
}

// Install prompt UI
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.createElement('button');
  btn.textContent = 'Install App';
  btn.style.position='fixed';
  btn.style.right='16px';
  btn.style.bottom='16px';
  btn.style.padding='10px 14px';
  btn.style.borderRadius='8px';
  btn.style.border='none';
  btn.style.boxShadow='0 2px 6px rgba(0,0,0,0.2)';
  btn.style.background='#13c8e0';
  btn.style.color='white';
  document.body.appendChild(btn);
  btn.addEventListener('click', async () => {
    btn.remove();
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
  });
});
</script>
</body></html>
